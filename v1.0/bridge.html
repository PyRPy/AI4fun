<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PlayBridge — Contract Bridge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Arial,sans-serif;color:#eee;overflow:hidden;user-select:none;-webkit-user-select:none;
 background:#0b3d2e;background:radial-gradient(ellipse at center,#17795a 0%,#0b3d2e 65%,#062018 100%)}
#app{display:flex;height:100vh}
#table{flex:1;position:relative;display:grid;padding:8px;gap:4px;
 grid-template-areas:".. nn .." "ww cc ee" ".. ss ..";
 grid-template-rows:150px 1fr 200px;grid-template-columns:150px 1fr 150px}
.seat{position:relative;display:flex;align-items:center;justify-content:center}
#seatN{grid-area:nn}#seatW{grid-area:ww}#seatE{grid-area:ee}#seatS{grid-area:ss}
.name-tag{position:absolute;top:2px;left:6px;font-size:12px;font-weight:700;color:#ffd76a;text-shadow:0 1px 2px #000;z-index:5}
.name-tag .turn{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-left:4px;box-shadow:0 0 6px #4caf50}
.card-count{position:absolute;bottom:2px;right:8px;font-size:11px;color:#bbb}
#center{grid-area:cc;position:relative;display:flex;align-items:center;justify-content:center}
#trickArea{position:relative;width:230px;height:190px}
.tslot{position:absolute;width:64px;height:90px}
.tslot.posN{top:0;left:83px}.tslot.posS{bottom:0;left:83px}
.tslot.posW{top:50px;left:0}.tslot.posE{top:50px;right:0}
#hintBar{position:absolute;left:50%;transform:translateX(-50%);bottom:172px;max-width:90%;padding:5px 14px;
 background:rgba(0,0,0,.55);border:1px solid #c9a227;border-radius:14px;font-size:13px;color:#ffe9a8;display:none;z-index:20;white-space:nowrap}
#contractBanner{position:absolute;top:6px;left:50%;transform:translateX(-50%);padding:4px 16px;background:rgba(0,0,0,.5);
 border-radius:12px;font-size:14px;font-weight:700;color:#ffd76a;display:none;z-index:20;white-space:nowrap}
/* side panel */
#panel{width:280px;margin:8px 8px 8px 0;padding:10px;background:rgba(0,0,0,.35);border-radius:10px;
 display:flex;flex-direction:column;gap:8px;font-size:13px;overflow:hidden}
#panel .row{display:flex;justify-content:space-between;gap:6px}
#panel .lbl{color:#9fc4b4}
#statusBox{border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px}
#auctionLog{flex:1;overflow-y:auto;background:rgba(0,0,0,.3);border-radius:8px;padding:6px}
#auctionLog table{width:100%;border-collapse:collapse;text-align:center;font-size:13px}
#auctionLog th{color:#ffd76a;border-bottom:1px solid rgba(255,255,255,.2);padding:2px}
#auctionLog td{padding:2px;height:20px}
#btnRow{display:flex;gap:6px}
#btnRow button{flex:1;padding:7px 4px;border:0;border-radius:6px;background:#14563f;color:#eee;font-size:12px;cursor:pointer}
#btnRow button:hover{background:#1c7355}
#btnRow button.on{background:#c9a227;color:#111;font-weight:700}
/* cards */
.c{position:relative;width:64px;height:90px;background:#fdfdf8;border-radius:6px;flex:0 0 auto;
 box-shadow:1px 2px 5px rgba(0,0,0,.55);color:#141414;cursor:default}
.c.red{color:#c8102e}
.c .corner{position:absolute;font-weight:700;font-size:15px;line-height:1.05;text-align:center;width:16px}
.c .corner small{display:block;font-size:14px}
.c .tl{top:3px;left:3px}.c .br{bottom:3px;right:3px;transform:rotate(180deg)}
.c .pip{position:absolute;font-size:21px;transform:translate(-50%,-50%);line-height:1}
.c .pip.flip{transform:translate(-50%,-50%) rotate(180deg)}
.c .bigpip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:44px;line-height:1}
.c .court{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:56px;border:1.5px solid currentColor;
 border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:800;
 background:linear-gradient(135deg,#fff 0%,#e8e2cf 100%);line-height:1.1}
.c .court small{font-size:15px;font-weight:400}
.c.back{background:repeating-linear-gradient(45deg,#1c4587 0 5px,#2f5da8 5px 10px);border:3px solid #eee}
.c.sm{width:44px;height:62px}
.c.sm .corner{font-size:11px;width:11px}.c.sm .corner small{font-size:10px}
.c.sm .pip{font-size:13px}.c.sm .bigpip{font-size:26px}.c.sm .court{width:26px;height:36px;font-size:13px}.c.sm .court small{font-size:10px}
.c.playable{cursor:pointer;transform:translateY(-8px);box-shadow:0 6px 10px rgba(0,0,0,.6)}
.c.playable:hover{outline:2px solid #ffd76a}
.c.dim{opacity:.45}
.c.hintcard{outline:3px solid #ffd76a;box-shadow:0 0 14px #ffd76a}
/* hands */
.hand{display:flex;align-items:center;justify-content:center}
#seatS .hand{padding:0 8px}
#seatS .c{margin-left:-16px}
#seatS .c:first-child{margin-left:0}
#seatN .c{margin-left:-24px}
#seatN .c:first-child{margin-left:0}
.vfan{display:flex;flex-direction:column;align-items:center}
.vfan .c{margin-top:-64px}
.vfan .c:first-child{margin-top:0}
/* bidding box */
#bidBox{position:absolute;z-index:30;background:rgba(8,24,18,.95);border:1px solid #2c6b52;border-radius:10px;
 padding:12px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.7)}
#bidBox h3{font-size:13px;color:#ffd76a;margin-bottom:8px;text-align:center}
.brow{display:flex;gap:5px;margin-bottom:5px}
.bbtn{width:44px;height:32px;border:1px solid #3b7a5e;border-radius:5px;background:#103c2c;color:#eee;font-size:14px;cursor:pointer}
.bbtn:hover:not(:disabled){background:#1c7355}
.bbtn:disabled{opacity:.28;cursor:not-allowed}
.bbtn.red{color:#ff7b93}
.bbtn.wide{width:62px;font-weight:700}
#bidHint{margin-top:6px;font-size:12px;color:#ffe9a8;min-height:16px;text-align:center;max-width:260px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100}
#modal .box{background:#10261d;border:1px solid #2c6b52;border-radius:12px;padding:22px 28px;min-width:320px;max-width:440px;text-align:center}
#modal h2{color:#ffd76a;margin-bottom:10px;font-size:20px}
#modal pre{text-align:left;font-size:13px;font-family:Consolas,monospace;color:#cfe8dc;margin:10px 0;white-space:pre-wrap}
#modal button{padding:9px 22px;border:0;border-radius:7px;background:#c9a227;color:#111;font-weight:700;font-size:14px;cursor:pointer}
#testOut{position:fixed;left:8px;bottom:8px;z-index:200;max-width:46vw;max-height:40vh;overflow:auto;background:rgba(0,0,0,.8);
 border:1px solid #444;border-radius:8px;padding:8px;font:11px Consolas,monospace;display:none;white-space:pre-wrap}
.pass{color:#7ee787}.fail{color:#ff7b93}
@media (max-width:900px){#panel{width:210px;font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <div id="table">
    <div class="seat" id="seatN"><span class="name-tag">North</span><div class="hand" id="handN"></div></div>
    <div class="seat" id="seatW"><span class="name-tag">West</span><div class="hand" id="handW"></div></div>
    <div id="center">
      <div id="contractBanner"></div>
      <div id="trickArea">
        <div class="tslot posN" id="tsN"></div>
        <div class="tslot posE" id="tsE"></div>
        <div class="tslot posS" id="tsS"></div>
        <div class="tslot posW" id="tsW"></div>
      </div>
      <div id="bidBox"></div>
      <div id="hintBar"></div>
    </div>
    <div class="seat" id="seatE"><span class="name-tag">East</span><div class="hand" id="handE"></div></div>
    <div class="seat" id="seatS"><span class="name-tag">South (You)</span><div class="hand" id="handS"></div></div>
  </div>
  <div id="panel">
    <div id="statusBox">
      <div class="row"><span class="lbl">Dealer</span><span id="stDealer">—</span></div>
      <div class="row"><span class="lbl">Contract</span><span id="stContract">—</span></div>
      <div class="row"><span class="lbl">Declarer</span><span id="stDeclarer">—</span></div>
      <div class="row"><span class="lbl">Tricks NS / EW</span><span id="stTricks">0 / 0</span></div>
      <div class="row"><span class="lbl">Score NS / EW</span><span id="stScore">0 / 0</span></div>
    </div>
    <div id="auctionLog"></div>
    <div id="btnRow">
      <button id="btnNew">New Deal</button>
      <button id="btnHints">Hints: ON</button>
      <button id="btnSound">Sound: ON</button>
    </div>
  </div>
</div>
<div id="modal"><div class="box"><h2 id="mTitle"></h2><pre id="mBody"></pre><button id="mBtn">Next Deal</button></div></div>
<div id="testOut"></div>
<script src="brain.js"></script>
<script>
/* ============================================================
   PlayBridge — Contract Bridge (game shell)
   The AI ("the brain") lives in brain.js — a swappable module
   implementing evaluate / suggestBid / choosePlay (see contract
   at the top of brain.js). Upgrade the game by replacing
   brain.js or calling setBrain(newBrain); this file never needs
   to change for a smarter AI.
   Logic modules are pure (no DOM) until the UI section.
   Seats: 0=N, 1=E, 2=S(human), 3=W. Clockwise order N,E,S,W.
   ============================================================ */
var SEATS=['N','E','S','W'], HUMAN=2;
var SUITS=['\u2663','\u2666','\u2665','\u2660'];       // club diamond heart spade
var RED=[false,true,true,false];
var STRAINS=['\u2663','\u2666','\u2665','\u2660','NT'];  // + NT for bidding
var RK='23456789TJQKA';
function partner(s){return (s+2)%4}
function nextSeat(s){return (s+1)%4}
function side(s){return s%2===0?'NS':'EW'}
function cardStr(c){return RK[c.r-2]+SUITS[c.s]}
function callStr(c){
  if(c.t==='pass')return 'Pass';
  if(c.t==='x')return 'X';
  if(c.t==='xx')return 'XX';
  return c.lvl+STRAINS[c.st];
}
/* ---------- Deck ---------- */
function makeDeck(){
  var d=[],s,r;
  for(s=0;s<4;s++)for(r=2;r<=14;r++)d.push({s:s,r:r});
  return d;
}
function shuffle(d){
  for(var i=d.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=d[i];d[i]=d[j];d[j]=t;}
  return d;
}
function sortHand(h){ // display order: spades,hearts,diamonds,clubs; rank desc
  h.sort(function(a,b){return b.s-a.s||b.r-a.r});
  return h;
}
function deal(){
  var d=shuffle(makeDeck());
  var hands=[[],[],[],[]],i;
  for(i=0;i<52;i++)hands[i%4].push(d[i]); // hands[0]=N,1=E,2=S,3=W
  return hands;
}
/* Hand evaluation lives in brain.js: Brain.evaluate(hand) */
/* ---------- Auction ---------- */
// call: {t:'pass'|'bid'|'x'|'xx', lvl, st, seat}
function bidVal(c){return (c.lvl-1)*5+c.st}
function lastBid(auction){
  for(var i=auction.length-1;i>=0;i--)if(auction[i].t==='bid')return auction[i];
  return null;
}
function legalInfo(auction,seat){
  var hb=lastBid(auction),canX=false,canXX=false,i,c;
  if(hb){
    var agg=null; // last x/xx after last bid
    for(i=auction.length-1;i>=0;i--){
      c=auction[i];
      if(c.t==='bid')break;
      if(c.t==='x'||c.t==='xx'){agg=c;break;}
    }
    if(!agg&&side(hb.seat)!==side(seat))canX=true;
    if(agg&&agg.t==='x'&&side(agg.seat)!==side(seat))canXX=true;
  }
  return {highBid:hb,canX:canX,canXX:canXX};
}
function cheapestLevel(auction,st){
  var hb=lastBid(auction),min=hb?bidVal(hb):-1,lvl;
  for(lvl=1;lvl<=7;lvl++)if((lvl-1)*5+st>min)return lvl;
  return null;
}
function isLegalCall(auction,seat,call){
  if(call.t==='pass')return true;
  var info=legalInfo(auction,seat);
  if(call.t==='x')return info.canX;
  if(call.t==='xx')return info.canXX;
  return !info.highBid||bidVal(call)>bidVal(info.highBid);
}
function auctionStatus(auction){
  var cons=0,i,hasBid=false;
  for(i=auction.length-1;i>=0;i--){
    if(auction[i].t==='pass')cons++;else break;
  }
  for(i=0;i<auction.length;i++)if(auction[i].t==='bid'){hasBid=true;break;}
  if(!hasBid&&auction.length>=4)return 'passedout';
  if(hasBid&&cons>=3)return 'complete';
  return 'ongoing';
}
function finalContract(auction){
  var fb=lastBid(auction),dbl=0,i;
  if(!fb)return null;
  for(i=auction.length-1;i>=0;i--){
    var c=auction[i];
    if(c.t==='bid')break;
    if(c.t==='x')dbl=1;
    if(c.t==='xx')dbl=2;
  }
  return {lvl:fb.lvl,st:fb.st,dbl:dbl,bidder:fb.seat};
}
function determineDeclarer(auction){
  var ct=finalContract(auction),i,c;
  if(!ct)return null;
  var ps=partner(ct.bidder);
  for(i=0;i<auction.length;i++){
    c=auction[i];
    if(c.t==='bid'&&c.st===ct.st&&(c.seat===ct.bidder||c.seat===ps))return c.seat;
  }
  return ct.bidder;
}
function lastSuitBidBy(auction,seat){
  for(var i=auction.length-1;i>=0;i--){
    var c=auction[i];
    if(c.t==='bid'&&c.seat===seat&&c.st<4)return c.st;
  }
  return null;
}
/* Bidding AI lives in brain.js: Brain.Brain.suggestBid(hand,auction,seat) */
/* ---------- Scoring (duplicate-style, not vulnerable) ---------- */
function trickValue(st){return st<2?20:30}
function scoreContract(ct,declarer,tricksDecl){
  var need=6+ct.lvl,got=tricksDecl,over=got-need,tv=trickValue(ct.st),lines=[],pts,sideWon;
  function baseTrickScore(){
    var v=ct.st===4?ct.lvl*30+10:ct.lvl*tv;
    return v*(ct.dbl===1?2:ct.dbl===2?4:1);
  }
  if(over>=0){
    var base=baseTrickScore();
    var bonus=base>=100?300:50;
    var ot=0;
    if(over>0){
      if(ct.dbl===0)ot=over*(ct.st===4?30:tv);
      else if(ct.dbl===1)ot=over*100;
      else ot=over*200;
    }
    var insult=ct.dbl===1?50:ct.dbl===2?100:0;
    pts=base+bonus+ot+insult;sideWon=side(declarer);
    lines.push('Contract: '+ct.lvl+STRAINS[ct.st]+(ct.dbl===1?' X':ct.dbl===2?' XX':'')+' by '+SEATS[declarer]);
    lines.push('Result: MADE '+(over>0?'+'+over:'exactly'));
    lines.push('Trick score: '+base+(ct.dbl?' (x'+(ct.dbl===1?2:4)+')':''));
    lines.push((base>=100?'Game bonus: ':'Part-score bonus: ')+bonus);
    if(ot)lines.push('Overtricks: '+ot);
    if(insult)lines.push('Insult bonus: '+insult);
    lines.push(sideWon+' scores '+pts);
  }else{
    var down=-over,pen;
    if(ct.dbl===0)pen=down*50;
    else{
      pen=down===1?100:down===2?300:500+(down-3)*300; // non-vul doubled: 100/300/500/800...
      if(ct.dbl===2)pen*=2;
    }
    pts=pen;sideWon=side(partner(declarer))==='NS'?'EW':'NS';
    lines.push('Contract: '+ct.lvl+STRAINS[ct.st]+(ct.dbl===1?' X':ct.dbl===2?' XX':'')+' by '+SEATS[declarer]);
    lines.push('Result: DOWN '+down);
    lines.push('Penalty: '+pen);
    lines.push(sideWon+' scores '+pts);
  }
  return {points:pts,side:sideWon,lines:lines};
}
/* ---------- Shared play rules (used by game flow AND brain.js) ---------- */
function ofSuit(hand,s){var out=[];for(var i=0;i<hand.length;i++)if(hand[i].s===s)out.push(hand[i]);return out}
function validCards(hand,ledSuit){
  if(ledSuit===null||ledSuit===undefined)return hand.slice();
  var f=ofSuit(hand,ledSuit);
  return f.length?f:hand.slice();
}
function trickWinner(trick,trump){
  var best=trick[0],i;
  for(i=1;i<trick.length;i++){
    var t=trick[i],bc=best.card,cc=t.card,led=trick[0].card.s;
    if(trump!==null&&trump!==undefined){
      if(cc.s===trump&&bc.s!==trump){best=t;continue}
      if(cc.s===trump&&bc.s===trump&&cc.r>bc.r){best=t;continue}
      if(bc.s===trump)continue;
    }
    if(cc.s===led&&bc.s!==led){best=t;continue}
    if(cc.s===bc.s&&cc.r>bc.r)best=t;
  }
  return best;
}
/* Play AI lives in brain.js: Brain.choosePlay(G,seat) */
/* ---------- Game state & flow ---------- */
function setBrain(b){ // hot-swap the AI; contract documented in brain.js
  if(b&&b.api===1&&typeof b.evaluate==='function'&&typeof b.suggestBid==='function'&&typeof b.choosePlay==='function'){Brain=b;return true}
  return false;
}
var G=null;
var UI={hints:true,sound:true};
function loadScore(){try{return JSON.parse(localStorage.getItem('pb_score'))||{NS:0,EW:0,deals:0}}catch(e){return {NS:0,EW:0,deals:0}}}
function saveScore(){try{localStorage.setItem('pb_score',JSON.stringify(SCORE))}catch(e){}}
var SCORE=loadScore();
function newDeal(){
  G={
    token:(G?G.token:0)+1,
    phase:'AUCTION',
    hands:deal(),
    dealer:SCORE.deals%4,
    auction:[],aTurn:null,
    contract:null,declarer:null,dummy:null,
    trick:[],lead:null,pTurn:null,
    tricksNS:0,tricksEW:0,trickNo:1,
    dummyRevealed:false
  };
  var i;
  for(i=0;i<4;i++)sortHand(G.hands[i]);
  G.aTurn=G.dealer;
  SCORE.deals++;saveScore();
  hideModal();
  renderAll();
  maybeAI();
}
function schedule(fn,ms){
  var tok=G.token;
  setTimeout(function(){if(G&&G.token===tok)fn();},ms);
}
function humanActsNow(){
  if(!G||G.phase!=='PLAY')return false;
  var seat=G.pTurn;
  if(seat===HUMAN&&G.dummy!==HUMAN)return true;
  if(seat===G.dummy&&G.declarer===HUMAN)return true;
  return false;
}
function maybeAI(){
  if(!G)return;
  if(G.phase==='AUCTION'){
    if(auctionStatus(G.auction)!=='ongoing'){finishAuction();return}
    if(G.aTurn!==HUMAN)schedule(aiBid,650);
  }else if(G.phase==='PLAY'){
    if(G.pTurn===null||G.pTurn===undefined)return; // trick being resolved
    if(!humanActsNow())schedule(aiPlay,750);
  }
}
function aiBid(){
  if(!G||G.phase!=='AUCTION')return;
  var s=Brain.suggestBid(G.hands[G.aTurn],G.auction,G.aTurn)||{t:'pass'};
  var call={t:s.t,lvl:s.lvl,st:s.st};
  if(!isLegalCall(G.auction,G.aTurn,call))call={t:'pass'}; // safety net
  applyCall(call);
}
function aiPlay(){
  if(!G||G.phase!=='PLAY'||G.pTurn===null||G.pTurn===undefined||humanActsNow())return;
  var seat=G.pTurn,ch=Brain.choosePlay(G,seat);
  applyPlay(seat,ch.card);
}
function applyCall(call){
  call.seat=G.aTurn;
  G.auction.push(call);
  G.aTurn=nextSeat(G.aTurn);
  renderAll();
  if(auctionStatus(G.auction)==='ongoing')maybeAI();
  else finishAuction();
}
function finishAuction(){
  if(auctionStatus(G.auction)==='passedout'){
    G.phase='SCORE';
    renderAll();
    showModal('Passed Out','All four players passed.\nNo score — redeal.');
    return;
  }
  G.contract=finalContract(G.auction);
  G.declarer=determineDeclarer(G.auction);
  G.dummy=partner(G.declarer);
  G.phase='PLAY';
  G.lead=nextSeat(G.declarer);
  G.pTurn=G.lead;
  renderAll();
  maybeAI();
}
function applyPlay(seat,card){
  var h=G.hands[seat],idx=-1,i;
  for(i=0;i<h.length;i++)if(h[i].s===card.s&&h[i].r===card.r){idx=i;break;}
  if(idx<0)return;
  h.splice(idx,1);
  G.trick.push({seat:seat,card:card});
  if(G.trickNo===1&&G.trick.length===1)G.dummyRevealed=true; // reveal dummy after opening lead
  if(G.trick.length===4){
    G.pTurn=null;
    renderAll();
    schedule(finishTrick,1100);
  }else{
    G.pTurn=nextSeat(seat);
    renderAll();
    maybeAI();
  }
}
function finishTrick(){
  var trump=G.contract.st<4?G.contract.st:null;
  var win=trickWinner(G.trick,trump);
  if(side(win.seat)==='NS')G.tricksNS++;else G.tricksEW++;
  G.trick=[];G.lead=win.seat;G.pTurn=win.seat;G.trickNo++;
  if(G.trickNo>13){finishPlay();return}
  renderAll();
  maybeAI();
}
function finishPlay(){
  G.phase='SCORE';
  var tricksDecl=side(G.declarer)==='NS'?G.tricksNS:G.tricksEW;
  var res=scoreContract(G.contract,G.declarer,tricksDecl);
  SCORE[res.side]+=res.points;
  saveScore();
  renderAll();

var AU={ctx:null,master:null,started:false};
function audioStart(){
  if(AU.started)return;
  var AC=(typeof window!=='undefined')&&(window.AudioContext||window.webkitAudioContext);
  if(!AC)return;
  try{
    AU.ctx=new AC();
    AU.master=AU.ctx.createGain();
    AU.master.gain.value=UI.sound?0.045:0;
    var filt=AU.ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=650;
    AU.master.connect(filt);filt.connect(AU.ctx.destination);
    var freqs=[196,246.94,293.66],i;
    for(i=0;i<freqs.length;i++){
      var o=AU.ctx.createOscillator();o.type='sine';o.frequency.value=freqs[i];o.detune.value=(i-1)*4;
      var g=AU.ctx.createGain();g.gain.value=0.33;
      o.connect(g);g.connect(AU.master);o.start();
    }
    var lfo=AU.ctx.createOscillator();lfo.frequency.value=0.08;
    var lg=AU.ctx.createGain();lg.gain.value=0.018;

function mkHand(arr){var h=[];for(var i=0;i<arr.length;i++)h.push({s:arr[i][0],r:arr[i][1]});return h}
function auc(spec){ // e.g. "N:1H E:P S:4H W:P" ; X=double, R=redouble, strains C D H S N
  var sm={C:0,D:1,H:2,S:3,N:4},out=[],parts=spec.split(/\s+/),i;
  for(i=0;i<parts.length;i++){
    var seg=parts[i].split(':'),v=seg[1],call;
    if(v==='P')call={t:'pass'};
    else if(v==='X')call={t:'x'};
    else if(v==='R')call={t:'xx'};
    else call={t:'bid',lvl:+v.charAt(0),st:sm[v.charAt(1)]};
    call.seat=SEATS.indexOf(seg[0]);
    out.push(call);
  }
  return out;
}

    return r.points===300&&r.side==='EW';});
  t('Down 1 undoubled = defenders 50',function(){
    return scoreContract({lvl:2,st:3,dbl:0,bidder:0},0,7).points===50;});
  var pass=0,fail=0,lines=[],i;
  for(i=0;i<results.length;i++){
    var r=results[i];
    if(r.pass)pass++;else fail++;
    lines.push((r.pass?'PASS  ':'FAIL  ')+r.name+(r.err?'  ['+r.err+']':''));
  }
  var summary='TESTS: '+pass+'/'+results.length+' passed'+(fail?'  ('+fail+' FAILED)':'');
  if(typeof document!=='undefined'){
    var out=el('testOut');
    out.textContent=summary+'\n'+lines.join('\n');
    out.style.display='block';
  }else{
    console.log(summary);
    for(i=0;i<lines.length;i++)if(lines[i].indexOf('FAIL')===0)console.log(lines[i]);
  }
  return {pass:pass,fail:fail,lines:lines};
}
